<!--
  Supabase sign-in email for Pedal Playground.

  Paste into BOTH templates (Authentication -> Email Templates):
    - "Magic Link"      (existing users)
    - "Confirm signup"  (first-time users; signInWithOtp creates the account)

  Suggested subject:  Your Pedal Playground sign-in code
  (Supabase renders template variables in the subject too, so "{{ .Token }}" can go there if you
   want the code visible in the notification. Check that it renders after you paste it.)

  Variables used: {{ .Token }} (6-digit code), {{ .SiteURL }}, {{ .TokenHash }}.
  The button link lands on the app, which asks for one click before using the token, so email
  scanners that load the page cannot use it up. The code works regardless.

  Images (logo, dot background) load from {{ .SiteURL }}/email/, so they show once that site has
  web/public/email deployed. Without them the email still reads fine: plain background, logo alt text.

  Design: Figma "Email template". DM Sans / DM Mono load where the mail app allows web fonts (Apple
  Mail, iOS); everywhere else it falls back to system fonts. Dark mode follows the reader's setting
  in mail apps that support prefers-color-scheme; Gmail applies its own dark colors instead.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=DM+Sans:opsz,wght@9..40,500;9..40,600&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: light dark; supported-color-schemes: light dark; }
      body { margin: 0; padding: 0; }
      /* The 1px border is translucent and the card's fill stops inside it, so the border darkens the shadow under it. */
      .pp-card { background-clip: padding-box !important; }
      .pp-logo-dark { display: none; }
      @media (prefers-color-scheme: dark) {
        .pp-bg { background-color: #131418 !important; background-image: url("{{ .SiteURL }}/email/dots-dark.png") !important; }
        .pp-card { background-color: #1b1c21 !important; border-color: rgba(255, 255, 255, 0.08) !important; box-shadow: 0 12px 16px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -4px rgba(0, 0, 0, 0.4) !important; }
        .pp-head { border-bottom-color: rgba(255, 255, 255, 0.06) !important; }
        .pp-text { color: #ececf1 !important; }
        .pp-muted { color: #9a9ca8 !important; }
        .pp-code { background-color: #26272e !important; color: #ececf1 !important; }
        .pp-button { background-color: #6c6cff !important; }
        .pp-logo-light { display: none !important; }
        .pp-logo-dark { display: block !important; }
      }
      /* Outlook.com dark mode */
      [data-ogsc] .pp-text { color: #ececf1 !important; }
      [data-ogsc] .pp-muted { color: #9a9ca8 !important; }
    </style>
  </head>
  <body class="pp-bg" style="margin:0;padding:0;background-color:#f8f8f8;background-image:url('{{ .SiteURL }}/email/dots-light.png');background-repeat:repeat;">
    <table role="presentation" class="pp-bg" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f8f8f8" background="{{ .SiteURL }}/email/dots-light.png" style="background-color:#f8f8f8;background-image:url('{{ .SiteURL }}/email/dots-light.png');background-repeat:repeat;padding:48px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" class="pp-card" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:440px;background-color:#ffffff;background-clip:padding-box;border:1px solid rgba(0,0,0,0.05);border-radius:8px;box-shadow:0 12px 16px -3px rgba(0,0,0,0.09),0 4px 6px -4px rgba(0,0,0,0.06);">
            <tr>
              <td class="pp-head" style="padding:12px 20px;border-bottom:1px solid rgba(0,0,0,0.05);">
                <img class="pp-logo-light" src="{{ .SiteURL }}/email/logo-light.png" width="153" height="30" alt="Pedal Playground" style="display:block;width:153px;height:30px;border:0;outline:none;text-decoration:none;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;color:#272c25;" />
                <!--[if !mso]><!-->
                <img class="pp-logo-dark" src="{{ .SiteURL }}/email/logo-dark.png" width="153" height="30" alt="Pedal Playground" style="display:none;width:153px;height:30px;border:0;outline:none;text-decoration:none;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;color:#ececf1;" />
                <!--<![endif]-->
              </td>
            </tr>
            <tr>
              <td class="pp-text" style="padding:20px 20px 0 20px;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;font-weight:500;line-height:20px;color:#000000;">
                Your one-time sign in code is:
              </td>
            </tr>
            <tr>
              <td style="padding:16px 20px 0 20px;">
                <div class="pp-code" style="font-family:'DM Mono','SFMono-Regular',Menlo,Consolas,monospace;font-size:32px;font-weight:500;line-height:42px;letter-spacing:16px;text-indent:16px;text-align:center;color:#000000;background-color:#f6f7f9;border-radius:8px;padding:12px 0;">{{ .Token }}</div>
              </td>
            </tr>
            <tr>
              <td class="pp-text" style="padding:16px 20px 0 20px;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;font-weight:500;line-height:20px;color:#000000;">
                Enter this code where you started signing in. It will expire soon and only works once.
              </td>
            </tr>
            <tr>
              <td style="padding:16px 20px 0 20px;">
                <a class="pp-button" href="{{ .SiteURL }}/?token_hash={{ .TokenHash }}&type=email"
                   style="display:block;background-color:#5c62fc;color:#ffffff;text-decoration:none;text-align:center;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;line-height:16px;letter-spacing:-0.15px;padding:10px 12px;border-radius:5px;box-shadow:0 1px 2px rgba(0,0,0,0.05);">Or, Sign in with one click</a>
              </td>
            </tr>
            <tr>
              <td class="pp-muted" style="padding:16px 20px 20px 20px;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;font-weight:500;line-height:17px;color:#87878c;">
                If you didn't ask to sign in, you can ignore this email.<br />Your password will not change.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
