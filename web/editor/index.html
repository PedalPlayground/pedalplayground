<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Catalog editor · Pedal Playground</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&display=swap" />
    <script>
      // Same saved theme as the playground, applied before first paint.
      try {
        var t = localStorage.getItem("pp:theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        if (localStorage.getItem("pp:dark") === "oled") document.documentElement.setAttribute("data-dark", "oled");
      } catch (e) {}
    </script>
    <style>
      /* Page color before the app's styles load, so a load never flashes white (matches --color-chrome). */
      html { background: #ffffff; color-scheme: light; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) { background: #15161c; color-scheme: dark; }
        html[data-dark="oled"]:not([data-theme="light"]) { background: #000; }
      }
      html[data-theme="dark"] { background: #15161c; color-scheme: dark; }
      html[data-theme="dark"][data-dark="oled"] { background: #000; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/editor/main.tsx"></script>
  </body>
</html>
