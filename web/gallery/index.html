<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Gallery · Pedal Playground</title>
    <meta name="description" content="Browse pedalboards shared by the Pedal Playground community, and make your own copy of any of them." />
    <link rel="canonical" href="https://pedalplayground.com/gallery/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&display=swap" />
    <script>
      // Same saved theme as the playground, applied before first paint.
      try {
        var t = localStorage.getItem("pp:theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        if (localStorage.getItem("pp:dark") === "oled") document.documentElement.setAttribute("data-dark", "oled");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/gallery/main.tsx"></script>
  </body>
</html>
