name: Temporary Supabase storage probe
on:
  push:
    branches: [claude/project-thread-nb88wx]
    paths: [.github/workflows/tmp-storage-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe
        run: |
          cat > probe.mjs <<'JS'
          const U = "https://ookpbdtmqbkapzcnzstv.supabase.co";
          const B = U + "/storage/v1/object/public/catalog-public/";
          const hdr = (r) => ["cf-cache-status", "cache-control", "age", "x-served-by"].map((h) => `${h}=${r.headers.get(h)}`).join(" ");
          async function timed(url, opts = {}) {
            const t = Date.now();
            try { const r = await fetch(url, opts); const body = await r.text(); return { s: r.status, ms: Date.now() - t, r, body }; }
            catch (e) { return { s: "ERR " + e.message, ms: Date.now() - t }; }
          }
          // The public anon key, from the live site's JS bundle.
          const html = await (await fetch("https://pedalplayground.com/")).text();
          const js = html.match(/assets\/[^"]+\.js/g) || [];
          let anon = null;
          for (const p of js) { const s = await (await fetch("https://pedalplayground.com/" + p)).text(); const m = s.match(/eyJ[\w-]+\.eyJ[\w-]+\.[\w-]+/g); if (m) { anon = m.find((k) => /anon/.test(Buffer.from(k.split(".")[1], "base64").toString())); if (anon) break; } }
          console.log("anon key found:", !!anon);
          const auth = anon ? { apikey: anon, Authorization: "Bearer " + anon } : {};

          console.log("\n== catalog.json (CDN copy) ==");
          let cat = null;
          for (let i = 0; i < 3; i++) { const x = await timed(B + "catalog.json"); console.log(x.s, x.ms + "ms", x.r && hdr(x.r), x.s !== 200 ? x.body?.slice(0, 200) : ""); if (x.s === 200) cat = JSON.parse(x.body); }
          console.log("\n== catalog.json bypassing CDN (forces a database lookup) ==");
          for (let i = 0; i < 5; i++) { const x = await timed(B + "catalog.json?probe=" + Date.now() + i); console.log(x.s, x.ms + "ms", x.r && hdr(x.r), x.s !== 200 ? x.body?.slice(0, 200) : ""); }

          console.log("\n== other database paths ==");
          for (const [name, url, opts] of [
            ["auth health", U + "/auth/v1/health", { headers: auth }],
            ["rest root", U + "/rest/v1/", { headers: auth }],
            ["storage list", U + "/storage/v1/object/list/catalog-public", { method: "POST", headers: { ...auth, "content-type": "application/json" }, body: JSON.stringify({ prefix: "thumb/pedals", limit: 5 }) }],
          ]) for (let i = 0; i < 3; i++) { const x = await timed(url, opts); console.log(name, x.s, x.ms + "ms", x.s !== 200 ? x.body?.slice(0, 200) : ""); }

          if (!cat) { console.log("no catalog, stopping"); process.exit(0); }
          const paths = Object.values(cat.assets.pedals).flatMap((a) => [a.thumb, a.img]);
          for (let i = paths.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [paths[i], paths[j]] = [paths[j], paths[i]]; }
          async function sweep(label, list, conc) {
            const st = {}, cache = {}, ms = [], bad = [];
            let i = 0;
            await Promise.all(Array.from({ length: conc }, async () => { while (i < list.length) { const p = list[i++]; const x = await timed(B + p, { method: "GET" }); st[x.s] = (st[x.s] || 0) + 1; ms.push(x.ms); if (x.r) { const c = x.r.headers.get("cf-cache-status"); cache[c] = (cache[c] || 0) + 1; } if (x.s !== 200 && bad.length < 5) bad.push(`${x.s} ${p} ${x.body?.slice(0, 150)}`); } }));
            ms.sort((a, b) => a - b);
            console.log(`\n== ${label}: ${list.length} images, ${conc} at a time ==`);
            console.log("status", JSON.stringify(st), "cdn", JSON.stringify(cache), "p50", ms[ms.length >> 1] + "ms", "p95", ms[Math.floor(ms.length * 0.95)] + "ms", "max", ms.at(-1) + "ms");
            bad.forEach((b) => console.log("  ", b));
          }
          await sweep("random images, gentle", paths.slice(0, 150), 4);
          await sweep("same images again", paths.slice(0, 150), 4);
          await sweep("random images, browser-like burst", paths.slice(150, 750), 30);
          JS
          node probe.mjs
